<svg width="1800" height="1460" viewBox="0 0 1800 1460" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .font { font-family: "Segoe UI", Arial, sans-serif; }
    .headline { font-size: 30px; font-weight: 700; fill: #101828; }
    .caption { font-size: 15px; fill: #667085; }
    .title { font-size: 22px; font-weight: 700; fill: #111827; }
    .sub { font-size: 13px; fill: #667085; }
    .section { font-size: 14px; font-weight: 700; fill: #344054; }
    .label { font-size: 12px; fill: #667085; }
    .rowTitle { font-size: 14px; font-weight: 700; fill: #111827; }
    .rowSub { font-size: 12px; fill: #667085; }
    .value { font-size: 13px; font-weight: 700; fill: #111827; }
    .chip { font-size: 11px; font-weight: 700; }
    .mono { font-family: Consolas, "Courier New", monospace; font-size: 12px; fill: #475467; }
  </style>

  <rect width="1800" height="1460" fill="#F3F5F8"/>
  <text x="900" y="58" text-anchor="middle" class="font headline">Desktop Settings: Current Capability Design</text>
  <text x="900" y="92" text-anchor="middle" class="font caption">A usable product design restricted to the capabilities that already exist in the current app.</text>

  <g transform="translate(102 132)">
    <rect width="1596" height="570" rx="24" fill="#111827"/>
    <rect x="14" y="14" width="1568" height="542" rx="18" fill="#F6F7F9"/>

    <g transform="translate(34 34)">
      <rect width="266" height="474" rx="16" fill="#FFFFFF" stroke="#E4E7EC"/>
      <text x="22" y="36" class="font title">Settings</text>
      <text x="22" y="60" class="font sub">Only current modules</text>
      <rect x="22" y="84" width="222" height="38" rx="10" fill="#F8FAFC" stroke="#E4E7EC"/>
      <circle cx="42" cy="103" r="7" stroke="#98A2B3" stroke-width="2"/>
      <path d="M47 108L52 113" stroke="#98A2B3" stroke-width="2" stroke-linecap="round"/>
      <text x="64" y="108" class="font label">Search current settings</text>

      <g transform="translate(22 150)">
        <rect width="222" height="46" rx="10" fill="#E8FAFC"/>
        <text x="14" y="22" class="font rowTitle" fill="#0891B2">Basic Settings</text>
        <text x="14" y="38" class="font rowSub" fill="#0891B2">Theme and local IP</text>
      </g>
      <g transform="translate(22 206)">
        <rect width="222" height="46" rx="10" fill="#F8FAFC"/>
        <text x="14" y="22" class="font rowTitle">Remote Control</text>
        <text x="14" y="38" class="font rowSub">xrdp, gate, permission</text>
      </g>
      <g transform="translate(22 262)">
        <rect width="222" height="46" rx="10" fill="#F8FAFC"/>
        <text x="14" y="22" class="font rowTitle">Project Help</text>
        <text x="14" y="38" class="font rowSub">Guide, about, license</text>
      </g>

      <line x1="22" y1="336" x2="244" y2="336" stroke="#EEF0F4"/>
      <text x="22" y="368" class="font label">This version intentionally does not show</text>
      <text x="22" y="392" class="font rowSub">Logs export, update center, security policy,</text>
      <text x="22" y="414" class="font rowSub">advanced diagnostics, multi-folder sharing.</text>
    </g>

    <g transform="translate(330 34)">
      <rect width="1218" height="474" rx="16" fill="#FFFFFF" stroke="#E4E7EC"/>
      <g transform="translate(28 28)">
        <text x="0" y="0" class="font title">Settings Overview</text>
        <text x="0" y="24" class="font sub">Make the landing page useful by showing current state before the user opens a submenu.</text>
      </g>

      <g transform="translate(28 78)">
        <rect width="1162" height="106" rx="14" fill="#F8FAFC" stroke="#E4E7EC"/>
        <text x="18" y="32" class="font section">Current state</text>
        <g transform="translate(18 52)">
          <rect width="142" height="32" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
          <text x="16" y="21" class="font label">Theme</text>
          <text x="126" y="21" text-anchor="end" class="font value">System</text>
          <rect x="154" width="170" height="32" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
          <text x="170" y="21" class="font label">Local IP</text>
          <text x="308" y="21" text-anchor="end" class="font value">Ready</text>
          <rect x="336" width="196" height="32" rx="10" fill="#EAF8EF" stroke="#C8EBD5"/>
          <circle cx="354" cy="16" r="4" fill="#16A34A"/>
          <text x="370" y="21" class="font value" fill="#15803D">xrdp 3390 ready</text>
          <rect x="544" width="146" height="32" rx="10" fill="#FFF4D6" stroke="#F6D98B"/>
          <text x="617" y="21" text-anchor="middle" class="font value" fill="#B45309">Gate off</text>
          <rect x="702" width="166" height="32" rx="10" fill="#E8FAFC" stroke="#BDECF2"/>
          <text x="785" y="21" text-anchor="middle" class="font value" fill="#0891B2">Screen granted</text>
        </g>
      </g>

      <g transform="translate(28 220)">
        <rect width="360" height="156" rx="14" fill="#FFFFFF" stroke="#E4E7EC"/>
        <rect x="18" y="22" width="40" height="40" rx="11" fill="#E8FAFC"/>
        <circle cx="38" cy="42" r="10" stroke="#0891B2" stroke-width="2"/>
        <text x="74" y="36" class="font rowTitle">Basic Settings</text>
        <text x="74" y="56" class="font rowSub">Appearance mode and local network address.</text>
        <line x1="18" y1="82" x2="342" y2="82" stroke="#EEF0F4"/>
        <text x="18" y="112" class="font label">Current theme</text>
        <text x="342" y="112" text-anchor="end" class="font value">System</text>
        <text x="18" y="138" class="font label">Local network</text>
        <text x="342" y="138" text-anchor="end" class="font value">192.168.1.24</text>
      </g>

      <g transform="translate(414 220)">
        <rect width="360" height="156" rx="14" fill="#FFFFFF" stroke="#E4E7EC"/>
        <rect x="18" y="22" width="40" height="40" rx="11" fill="#EAF3FF"/>
        <rect x="30" y="33" width="16" height="14" rx="3" stroke="#0A84FF" stroke-width="2"/>
        <text x="74" y="36" class="font rowTitle">Remote Control</text>
        <text x="74" y="56" class="font rowSub">xrdp service, access code, screen permission.</text>
        <line x1="18" y1="82" x2="342" y2="82" stroke="#EEF0F4"/>
        <text x="18" y="112" class="font label">Service</text>
        <text x="342" y="112" text-anchor="end" class="font value">Listening on 3390</text>
        <text x="18" y="138" class="font label">Access gate</text>
        <text x="342" y="138" text-anchor="end" class="font value">Off</text>
      </g>

      <g transform="translate(800 220)">
        <rect width="390" height="156" rx="14" fill="#FFFFFF" stroke="#E4E7EC"/>
        <rect x="18" y="22" width="40" height="40" rx="11" fill="#F3E8FF"/>
        <circle cx="38" cy="42" r="11" stroke="#7C3AED" stroke-width="2"/>
        <path d="M35 38C35 35 37 33.5 39.6 33.5C42.2 33.5 44 35.2 44 37.4C44 39.3 42.8 40.4 41 41.4C39.3 42.3 38.5 43.2 38.5 45" stroke="#7C3AED" stroke-width="2" stroke-linecap="round"/>
        <circle cx="38.5" cy="49" r="1.5" fill="#7C3AED"/>
        <text x="74" y="36" class="font rowTitle">Project Help</text>
        <text x="74" y="56" class="font rowSub">Current guide, about links, component licenses.</text>
