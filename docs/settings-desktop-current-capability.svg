        <text x="18" y="112" class="font label">Guide items</text>
        <text x="372" y="112" text-anchor="end" class="font value">4</text>
        <text x="18" y="138" class="font label">Project links</text>
        <text x="372" y="138" text-anchor="end" class="font value">3 + license</text>
      </g>
    </g>

    <text x="798" y="600" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#344054">Current-capability settings landing page</text>
  </g>

  <g transform="translate(102 760)">
    <rect width="1596" height="462" rx="24" fill="#111827"/>
    <rect x="14" y="14" width="1568" height="434" rx="18" fill="#F6F7F9"/>

    <g transform="translate(34 34)">
      <rect width="1510" height="366" rx="16" fill="#FFFFFF" stroke="#E4E7EC"/>
      <g transform="translate(28 28)">
        <text x="0" y="0" class="font title">Remote Control Subpage</text>
        <text x="0" y="24" class="font sub">This is the most important current page. Keep it compact, operational, and limited to implemented features.</text>
        <g transform="translate(1028 -4)">
          <rect width="112" height="28" rx="14" fill="#EAF8EF"/>
          <circle cx="18" cy="14" r="4" fill="#16A34A"/>
          <text x="34" y="18" class="font chip" fill="#15803D">Listening</text>
          <rect x="124" width="86" height="28" rx="14" fill="#FFF4D6"/>
          <text x="167" y="18" text-anchor="middle" class="font chip" fill="#B45309">Gate off</text>
          <rect x="222" width="116" height="28" rx="14" fill="#E8FAFC"/>
          <text x="280" y="18" text-anchor="middle" class="font chip" fill="#0891B2">Screen OK</text>
        </g>
      </g>

      <g transform="translate(28 88)">
        <rect width="352" height="212" rx="14" fill="#F8FAFC" stroke="#E4E7EC"/>
        <text x="18" y="32" class="font section">xrdp Service</text>
        <text x="18" y="58" class="font label">Status</text>
        <text x="150" y="58" class="font value">Listening</text>
        <text x="18" y="88" class="font label">Port</text>
        <text x="150" y="88" class="font value">3390</text>
        <text x="18" y="118" class="font label">Message</text>
        <text x="150" y="118" class="font value">Ready for RDP</text>
        <rect x="18" y="150" width="96" height="34" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
        <text x="66" y="172" text-anchor="middle" class="font rowTitle">Refresh</text>
        <rect x="126" y="150" width="96" height="34" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
        <text x="174" y="172" text-anchor="middle" class="font rowTitle">Start</text>
      </g>

      <g transform="translate(408 88)">
        <rect width="352" height="212" rx="14" fill="#F8FAFC" stroke="#E4E7EC"/>
        <text x="18" y="32" class="font section">Access Code Gate</text>
        <rect x="292" y="20" width="42" height="24" rx="12" fill="#D0D5DD"/>
        <circle cx="304" cy="32" r="9" fill="#FFFFFF"/>
        <text x="18" y="62" class="font label">Mode</text>
        <text x="150" y="62" class="font value">Off by default</text>
        <text x="18" y="92" class="font label">Current code</text>
        <text x="150" y="92" class="font value">Disabled</text>
        <text x="18" y="122" class="font label">Behavior</text>
        <text x="150" y="122" class="font value">Restart xrdp after change</text>
        <rect x="18" y="154" width="126" height="34" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
        <text x="81" y="176" text-anchor="middle" class="font rowTitle">Regenerate</text>
      </g>

      <g transform="translate(788 88)">
        <rect width="352" height="212" rx="14" fill="#F8FAFC" stroke="#E4E7EC"/>
        <text x="18" y="32" class="font section">Screen Permission</text>
        <text x="18" y="62" class="font label">Current state</text>
        <text x="150" y="62" class="font value">Granted</text>
        <text x="18" y="92" class="font label">Required for</text>
        <text x="150" y="92" class="font value">Remote video stream</text>
        <text x="18" y="122" class="font label">Action</text>
        <text x="150" y="122" class="font value">Open system permission</text>
        <rect x="18" y="154" width="126" height="34" rx="10" fill="#FFFFFF" stroke="#D0D5DD"/>
        <text x="81" y="176" text-anchor="middle" class="font rowTitle">Authorize</text>
      </g>

      <g transform="translate(1168 88)">
        <rect width="314" height="212" rx="14" fill="#F8FAFC" stroke="#E4E7EC"/>
        <text x="18" y="32" class="font section">Remote Files</text>
        <text x="18" y="62" class="font label">Windows path</text>
        <rect x="18" y="76" width="278" height="34" rx="10" fill="#FFFFFF" stroke="#E4E7EC"/>
        <text x="34" y="98" class="font mono">\\tsclient\\Downloads</text>
        <text x="18" y="138" class="font label">Current ability</text>
        <text x="18" y="162" class="font value">Help / explanation entry</text>
        <rect x="18" y="176" width="112" height="28" rx="9" fill="#FFFFFF" stroke="#D0D5DD"/>
        <text x="74" y="195" text-anchor="middle" class="font label" fill="#111827">View Help</text>
      </g>
    </g>

    <text x="798" y="492" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#344054">Current-capability Remote Control page</text>
  </g>

  <g transform="translate(102 1280)">
    <rect width="1596" height="118" rx="24" fill="#FFFFFF" stroke="#E4E7EC"/>
    <text x="28" y="34" class="font title">Status Version: Existing States Only</text>
    <text x="28" y="60" class="font sub">Add these visual states without adding new product features.</text>

    <g transform="translate(28 76)">
      <rect width="138" height="28" rx="14" fill="#EAF8EF"/>
      <circle cx="18" cy="14" r="4" fill="#16A34A"/>
      <text x="34" y="18" class="font chip" fill="#15803D">Running</text>
      <rect x="150" width="128" height="28" rx="14" fill="#F2F4F7"/>
      <circle cx="168" cy="14" r="4" fill="#98A2B3"/>
      <text x="184" y="18" class="font chip" fill="#475467">Stopped</text>
      <rect x="290" width="120" height="28" rx="14" fill="#E8FAFC"/>
      <circle cx="308" cy="14" r="4" fill="#0891B2"/>
      <text x="324" y="18" class="font chip" fill="#0891B2">Busy</text>
      <rect x="422" width="126" height="28" rx="14" fill="#FEECEC"/>
      <circle cx="440" cy="14" r="4" fill="#DC2626"/>
      <text x="456" y="18" class="font chip" fill="#B91C1C">Failed</text>
      <rect x="580" width="152" height="28" rx="14" fill="#FFF4D6"/>
      <text x="656" y="18" text-anchor="middle" class="font chip" fill="#B45309">Permission missing</text>
      <rect x="744" width="112" height="28" rx="14" fill="#EAF8EF"/>
      <text x="800" y="18" text-anchor="middle" class="font chip" fill="#15803D">Gate on</text>
      <rect x="868" width="106" height="28" rx="14" fill="#F2F4F7"/>
      <text x="921" y="18" text-anchor="middle" class="font chip" fill="#475467">Gate off</text>
      <rect x="986" width="144" height="28" rx="14" fill="#EAF3FF"/>
      <text x="1058" y="18" text-anchor="middle" class="font chip" fill="#0A84FF">Active session</text>
    </g>
