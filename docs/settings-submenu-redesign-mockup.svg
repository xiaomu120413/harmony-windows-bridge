        <text x="16" y="25" class="font rowTitle">Connection form</text>
        <text x="16" y="42" class="font rowDesc">Host, Port, Username, Password</text>
      </g>
      <g transform="translate(0 133)">
        <rect width="320" height="52" rx="12" fill="#FFFFFF" stroke="#E7EAF0"/>
        <text x="16" y="25" class="font rowTitle">Remote files</text>
        <text x="16" y="42" class="font rowDesc">Downloads sharing instructions</text>
      </g>
    </g>

    <g transform="translate(36 430)">
      <text x="0" y="0" class="font h2">Security and troubleshooting</text>
      <g transform="translate(0 17)">
        <rect width="320" height="52" rx="12" fill="#FFFFFF" stroke="#E7EAF0"/>
        <text x="16" y="25" class="font rowTitle">Certificate policy</text>
        <text x="16" y="42" class="font rowDesc">Current default: TOFU</text>
      </g>
      <g transform="translate(0 75)">
        <rect width="320" height="52" rx="12" fill="#FFFFFF" stroke="#E7EAF0"/>
        <text x="16" y="25" class="font rowTitle">Connection failures</text>
        <text x="16" y="42" class="font rowDesc">Port, firewall, OS version, credentials</text>
      </g>
      <g transform="translate(0 133)">
        <rect width="320" height="52" rx="12" fill="#FFFFFF" stroke="#E7EAF0"/>
        <text x="16" y="25" class="font rowTitle">Project and licenses</text>
        <text x="16" y="42" class="font rowDesc">GitHub, FreeRDP, xrdp, MIT</text>
      </g>
      <g transform="translate(0 191)">
        <rect width="320" height="38" rx="12" fill="#FFFFFF" stroke="#D0D5DD" stroke-dasharray="5 5"/>
        <text x="16" y="25" class="font small">Reserved: error codes, logs, feedback</text>
      </g>
    </g>

    <rect x="35" y="632" width="322" height="40" fill="url(#fadePhone)"/>
    <text x="196" y="756" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#344054">Phone: Long-content submenu</text>
  </g>

  <g transform="translate(236 970)">
