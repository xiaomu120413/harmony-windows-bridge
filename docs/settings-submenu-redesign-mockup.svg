        <text x="14" y="22" class="font rowTitle" fill="#0A84FF">Remote Control</text>
      </g>
      <text x="32" y="152" class="font rowDesc">Basic Settings</text>
      <text x="32" y="185" class="font rowDesc">Display and Input</text>
      <text x="32" y="218" class="font rowDesc">File Sharing</text>
      <text x="150" y="152" class="font rowDesc">Security Policy</text>
      <text x="150" y="185" class="font rowDesc">Help and Project</text>
    </g>

    <g transform="translate(338 80)">
      <rect width="920" height="206" rx="16" fill="#FFFFFF" stroke="#E7EAF0"/>
      <text x="24" y="34" class="font" font-size="22" font-weight="700" fill="#111827">Remote Control</text>
      <text x="24" y="58" class="font small">A wider detail panel reduces scrolling and keeps actions close to their state.</text>

      <g transform="translate(24 82)">
        <rect width="270" height="100" rx="14" fill="#F8FAFC" stroke="#E7EAF0"/>
        <text x="16" y="30" class="font rowTitle">Local xrdp port</text>
        <text x="16" y="52" class="font rowDesc">3390, running</text>
        <rect x="188" y="58" width="62" height="28" rx="9" fill="#FFFFFF" stroke="#E5E7EB"/>
        <text x="219" y="77" text-anchor="middle" class="font small" fill="#111827">Refresh</text>
      </g>
      <g transform="translate(318 82)">
        <rect width="270" height="100" rx="14" fill="#F8FAFC" stroke="#E7EAF0"/>
        <text x="16" y="30" class="font rowTitle">Access gate</text>
        <text x="16" y="52" class="font rowDesc">Disabled, code can regenerate</text>
        <rect x="210" y="24" width="42" height="24" rx="12" fill="#D0D5DD"/>
        <circle cx="222" cy="36" r="9" fill="#FFFFFF"/>
      </g>
      <g transform="translate(612 82)">
        <rect width="270" height="100" rx="14" fill="#F8FAFC" stroke="#E7EAF0"/>
        <text x="16" y="30" class="font rowTitle">Permissions and files</text>
        <text x="16" y="52" class="font rowDesc">Screen OK, Downloads shared</text>
        <g transform="translate(16 66)">
