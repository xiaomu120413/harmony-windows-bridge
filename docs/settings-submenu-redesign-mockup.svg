      <path d="M22 13L14 21L22 29" stroke="#111827" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="19" class="font title">Help and Project</text>
      <text x="44" y="42" class="font small">Search and groups for long content</text>
