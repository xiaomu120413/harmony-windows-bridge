<svg width="1800" height="1380" viewBox="0 0 1800 1380" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    .font { font-family: "Segoe UI", Arial, sans-serif; }
    .small { font-size: 12px; fill: #667085; }
    .title { font-size: 22px; font-weight: 700; fill: #111827; }
    .h2 { font-size: 15px; font-weight: 700; fill: #344054; }
    .rowTitle { font-size: 14px; font-weight: 700; fill: #111827; }
    .rowDesc { font-size: 12px; fill: #667085; }
    .chipText { font-size: 11px; font-weight: 700; }
  </style>

  <defs>
    <linearGradient id="fadePhone" x1="196" y1="632" x2="196" y2="672" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F6F7F9" stop-opacity="0"/>
      <stop offset="1" stop-color="#F6F7F9"/>
    </linearGradient>
  </defs>

  <rect width="1800" height="1380" fill="#F3F5F8"/>
  <text x="900" y="60" text-anchor="middle" class="font" font-size="30" font-weight="700" fill="#101828">Settings Submenu Mockup</text>
  <text x="900" y="94" text-anchor="middle" class="font" font-size="16" fill="#667085">Phone uses drill-down pages. Tablet keeps a sidebar and swaps detail panels. Search and groups handle future growth.</text>

  <g transform="translate(124 140)">
    <rect x="0" y="0" width="392" height="720" rx="34" fill="#101828"/>
    <rect x="13" y="13" width="366" height="694" rx="27" fill="#F6F7F9"/>

    <g transform="translate(36 42)">
      <path d="M22 13L14 21L22 29" stroke="#111827" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="19" class="font title">Basic Settings</text>
      <text x="44" y="42" class="font small">Appearance, network and future basics</text>
    </g>

    <g transform="translate(36 104)">
      <rect width="320" height="86" rx="14" fill="#FFFFFF" stroke="#E7EAF0"/>
      <text x="16" y="27" class="font h2">Current state</text>
      <text x="16" y="53" class="font small">Theme</text>
      <text x="88" y="53" class="font rowTitle">System</text>
      <text x="190" y="53" class="font small">Local IP</text>
      <text x="252" y="53" class="font rowTitle">Ready</text>
    </g>

    <g transform="translate(36 218)">
      <text x="0" y="0" class="font h2">Appearance</text>
      <text x="0" y="21" class="font small">List style can keep growing without redesign.</text>

      <g transform="translate(0 38)">
        <rect width="320" height="58" rx="12" fill="#FFFFFF" stroke="#0A84FF"/>
        <rect x="14" y="12" width="34" height="34" rx="9" fill="#E8FAFC"/>
        <circle cx="31" cy="29" r="9" stroke="#0891B2" stroke-width="2"/>
        <text x="62" y="26" class="font rowTitle">Follow system</text>
        <text x="62" y="45" class="font rowDesc">Switch with system appearance</text>
        <circle cx="296" cy="29" r="8" fill="#0A84FF"/>
        <path d="M292 29L295 32L301 25" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
      <g transform="translate(0 104)">
        <rect width="320" height="54" rx="12" fill="#FFFFFF" stroke="#E7EAF0"/>
        <rect x="14" y="10" width="34" height="34" rx="9" fill="#FFF0E5"/>
        <circle cx="31" cy="27" r="8" fill="#EA580C" opacity="0.85"/>
        <text x="62" y="25" class="font rowTitle">Light mode</text>
        <text x="62" y="43" class="font rowDesc">Always use light appearance</text>
      </g>
      <g transform="translate(0 166)">
        <rect width="320" height="54" rx="12" fill="#FFFFFF" stroke="#E7EAF0"/>
        <rect x="14" y="10" width="34" height="34" rx="9" fill="#EEF2FF"/>
        <path d="M35 18C30 20 27 25 29 31C31 37 37 40 43 38C39 42 31 43 26 38C20 33 20 24 25 19C28 16 32 15 35 18Z" fill="#4F46E5"/>
        <text x="62" y="25" class="font rowTitle">Dark mode</text>
        <text x="62" y="43" class="font rowDesc">Always use dark appearance</text>
      </g>
    </g>

    <g transform="translate(36 500)">
