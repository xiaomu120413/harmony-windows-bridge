        <text x="62" y="44" class="font rowDesc">Granted</text>
        <text x="300" y="37" text-anchor="end" class="font small" fill="#98A2B3">&gt;</text>
      </g>
      <g transform="translate(0 84)">
        <rect width="320" height="58" rx="12" fill="#FFFFFF" stroke="#E7EAF0"/>
        <rect x="14" y="12" width="34" height="34" rx="9" fill="#F3E8FF"/>
        <path d="M24 26H40V40H24V26Z" stroke="#7C3AED" stroke-width="2"/>
        <path d="M24 26L28 21H36L40 26" stroke="#7C3AED" stroke-width="2"/>
