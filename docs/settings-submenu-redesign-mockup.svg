      <rect x="140" width="66" height="28" rx="14" fill="#FFFFFF" stroke="#E7EAF0"/>
      <text x="173" y="19" text-anchor="middle" class="font chipText" fill="#475467">Security</text>
      <rect x="216" width="82" height="28" rx="14" fill="#FFFFFF" stroke="#E7EAF0"/>
      <text x="257" y="19" text-anchor="middle" class="font chipText" fill="#475467">Project</text>
    </g>

    <g transform="translate(36 218)">
      <text x="0" y="0" class="font h2">Connection flow</text>
      <g transform="translate(0 17)">
        <rect width="320" height="52" rx="12" fill="#FFFFFF" stroke="#E7EAF0"/>
        <text x="16" y="25" class="font rowTitle">Before connecting</text>
        <text x="16" y="42" class="font rowDesc">RDP service, network, account rights</text>
      </g>
      <g transform="translate(0 75)">
