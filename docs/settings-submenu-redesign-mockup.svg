        <text x="62" y="44" class="font rowDesc">\\tsclient\\Downloads</text>
        <text x="300" y="37" text-anchor="end" class="font small" fill="#98A2B3">&gt;</text>
      </g>
    </g>

    <text x="196" y="756" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#344054">Phone: Remote submenu</text>
  </g>

  <g transform="translate(1284 140)">
    <rect x="0" y="0" width="392" height="720" rx="34" fill="#101828"/>
    <rect x="13" y="13" width="366" height="694" rx="27" fill="#F6F7F9"/>

