      <g transform="translate(0 17)">
        <rect width="320" height="96" rx="12" fill="#FFFFFF" stroke="#E7EAF0"/>
        <text x="16" y="28" class="font small">Interface</text>
        <text x="16" y="52" class="font rowTitle">wlan0</text>
        <text x="16" y="76" class="font rowDesc">192.168.1.24/24</text>
        <rect x="244" y="20" width="58" height="32" rx="10" fill="#F2F4F7" stroke="#E5E7EB"/>
        <text x="273" y="41" text-anchor="middle" class="font small" fill="#111827">Refresh</text>
      </g>
      <g transform="translate(0 124)">
        <rect width="320" height="42" rx="12" fill="#FFFFFF" stroke="#D0D5DD" stroke-dasharray="5 5"/>
        <text x="16" y="27" class="font small">Reserved: language, default size, cert policy</text>
      </g>
    </g>
    <text x="196" y="756" text-anchor="middle" class="font" font-size="14" font-weight="700" fill="#344054">Phone: Basic submenu</text>
  </g>

  <g transform="translate(704 140)">
    <rect x="0" y="0" width="392" height="720" rx="34" fill="#101828"/>
    <rect x="13" y="13" width="366" height="694" rx="27" fill="#F6F7F9"/>

    <g transform="translate(36 42)">
      <path d="M22 13L14 21L22 29" stroke="#111827" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="44" y="19" class="font title">Remote Control</text>
      <text x="44" y="42" class="font small">Service, permission, gate and files</text>
    </g>

    <g transform="translate(36 104)">
      <rect width="320" height="78" rx="14" fill="#FFFFFF" stroke="#E7EAF0"/>
      <text x="16" y="29" class="font h2">Remote state</text>
      <g transform="translate(16 42)">
        <rect width="82" height="24" rx="12" fill="#EAF8EF"/>
        <circle cx="14" cy="12" r="4" fill="#16A34A"/>
        <text x="27" y="16" class="font chipText" fill="#15803D">xrdp ready</text>
      </g>
      <g transform="translate(108 42)">
        <rect width="76" height="24" rx="12" fill="#FFF4D6"/>
        <text x="38" y="16" text-anchor="middle" class="font chipText" fill="#B45309">Gate off</text>
      </g>
      <g transform="translate(194 42)">
        <rect width="96" height="24" rx="12" fill="#E8FAFC"/>
        <text x="48" y="16" text-anchor="middle" class="font chipText" fill="#0891B2">Screen OK</text>
      </g>
    </g>

    <g transform="translate(36 208)">
