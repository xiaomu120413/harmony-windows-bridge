    <rect x="14" y="14" width="1300" height="302" rx="22" fill="#F6F7F9"/>

    <g transform="translate(38 36)">
      <text x="0" y="0" class="font" font-size="20" font-weight="700" fill="#111827">Tablet and foldable reserve: Split View</text>
      <text x="0" y="25" class="font small">Wide screens keep the settings catalog visible. Detail panels can use two or three columns.</text>
    </g>

    <g transform="translate(38 80)">
      <rect width="270" height="206" rx="16" fill="#FFFFFF" stroke="#E7EAF0"/>
      <text x="18" y="31" class="font h2">Settings</text>
      <rect x="18" y="48" width="234" height="34" rx="10" fill="#F8FAFC" stroke="#E7EAF0"/>
      <text x="34" y="70" class="font small">Search settings</text>

      <g transform="translate(18 96)">
