<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>FreeRDP Control Demo</title>
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <main class="shell">
      <section class="workspace">
        <header class="topbar">
          <div>
            <p class="eyebrow">FreeRDP Control Demo</p>
            <h1>连接 Windows 远程桌面</h1>
          </div>
          <div class="status-pill" id="runtimeStatus">检测中</div>
        </header>

        <section class="content-grid">
          <form class="panel form-panel" id="connectForm">
            <div class="section-title">
              <h2>连接参数</h2>
              <button type="button" class="icon-button" id="reloadStatus" title="重新检测">↻</button>
            </div>

            <label>
              <span>Windows 机器 IP / 主机名</span>
              <input id="host" name="host" autocomplete="off" placeholder="192.168.1.20" required>
            </label>

            <div class="two-col">
              <label>
                <span>端口</span>
                <input id="port" name="port" inputmode="numeric" value="3389" required>
              </label>
              <label>
                <span>证书策略</span>
                <select id="certMode" name="certMode">
                  <option value="tofu">首次信任</option>
                  <option value="ask">每次询问</option>
                  <option value="ignore">忽略证书</option>
                </select>
              </label>
            </div>

            <label>
              <span>用户名</span>
              <input id="user" name="user" autocomplete="username" placeholder="TARGET-PC\demo">
            </label>

            <label>
              <span>域，可选</span>
              <input id="domain" name="domain" autocomplete="off" placeholder="CORP">
            </label>

            <div class="two-col">
              <label>
                <span>窗口大小</span>
                <input id="size" name="size" value="1400x900">
              </label>
              <label>
                <span>共享目录，可选</span>
                <input id="sharePath" name="sharePath" placeholder="C:\Users\mu\Desktop\share">
              </label>
            </div>

            <label>
              <span>连接引擎</span>
              <select id="engine" name="engine">
                <option value="library">FreeRDP library / native bridge</option>
                <option value="process">wfreerdp executable / 兼容模式</option>
                <option value="mstsc">Windows mstsc / 系统客户端</option>
              </select>
            </label>

            <details>
              <summary>高级选项</summary>
              <label>
                <span>native bridge 路径</span>
                <input id="bridgePath" name="bridgePath" placeholder="C:\path\to\freerdp_bridge.exe">
              </label>
              <label>
                <span>wfreerdp.exe 路径</span>
                <input id="freeRdpPath" name="freeRdpPath" placeholder="C:\tools\freerdp\wfreerdp.exe">
              </label>
              <div class="toggles">
                <label class="check-row">
                  <input id="clipboard" name="clipboard" type="checkbox" checked>
                  <span>启用剪贴板</span>
                </label>
                <label class="check-row">
                  <input id="fullscreen" name="fullscreen" type="checkbox">
                  <span>全屏打开</span>
                </label>
              </div>
            </details>

            <div class="actions">
              <button type="button" class="secondary" id="testConnection">测试端口</button>
              <button type="button" class="secondary" id="previewCommand">预览命令</button>
              <button type="submit" class="primary">连接</button>
            </div>
          </form>

          <aside class="panel side-panel">
            <div class="section-title">
              <h2>运行状态</h2>
            </div>
            <div class="status-list">
              <div>
                <span>FreeRDP</span>
                <strong id="freerdpState">检测中</strong>
              </div>
              <div>
                <span>Native bridge</span>
                <strong id="nativeBridgeState">检测中</strong>
              </div>
              <div>
                <span>Windows mstsc</span>
                <strong id="mstscState">检测中</strong>
              </div>
              <div>
                <span>配置来源</span>
                <strong id="configSource">-</strong>
              </div>
              <div>
                <span>目标端口</span>
                <strong id="tcpState">未测试</strong>
              </div>
            </div>

            <div class="log-box" id="logBox" aria-live="polite"></div>

            <div class="note">
              推荐使用 library 引擎。当前桌面 demo 通过 native bridge 链接 FreeRDP 库；后续迁到鸿蒙时，同一层会变成 HarmonyOS NAPI/native 模块并渲染到 ArkUI/Native surface。
            </div>
          </aside>
        </section>
      </section>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
