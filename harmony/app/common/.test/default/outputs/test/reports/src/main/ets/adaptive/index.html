<!doctype html>
<html lang="en">

<head>
  <!-- Import style -->
  <link rel="stylesheet" href="..\..\..\..\index.css" />
  <!-- Import Vue 3 -->
  <script src="..\..\..\..\vue.global.prod.js"></script>
  <!-- Import component library -->
  <script src="..\..\..\..\index.full.min.js"></script>
  <meta charset="UTF-8">
  <title>Coverage</title>
</head>

<body>
  <div id="app" class="common-layout">
    <el-container>
      <el-header>
        <el-row>
          <span>All Files Coverage</span>
          <el-divider />
        </el-row>
      </el-header>
      <el-main>
        <el-row>
          <el-col :span="8">
            <div class="statistic-card">
              <el-statistic :precision="2" :value="tableData.summary.functions.pct">
                <template #title>
                  <div style="display: inline-flex; align-items: center">
                    Functions
                  </div>
                </template>
                <template #suffix>%</template>
              </el-statistic>
              <div class="statistic-footer">
                <div class="footer-item">
                  <span>{{tableData.summary.functions.covered}}/{{tableData.summary.functions.total}}</span>
                </div>
              </div>
            </div>
          </el-col>

          <el-col :span="8">
            <div class="statistic-card">
              <el-statistic :precision="2" :value="tableData.summary.branches.pct">
                <template #title>
                  <div style="display: inline-flex; align-items: center">
                    Branches
                  </div>
                </template>
                <template #suffix>%</template>
              </el-statistic>
              <div class="statistic-footer">
                <div class="footer-item">
                  <span>{{tableData.summary.branches.covered}}/{{tableData.summary.branches.total}}</span>
                </div>
              </div>
            </div>
          </el-col>

          <el-col :span="8">
            <div class="statistic-card">
              <el-statistic :precision="2" :value="tableData.summary.lines.pct">
                <template #title>
                  <div style="display: inline-flex; align-items: center">
                    Lines
                  </div>
                </template>
                <template #suffix>%</template>
              </el-statistic>
              <div class="statistic-footer">
                <div class="footer-item">
                  <span>{{tableData.summary.lines.covered}}/{{tableData.summary.lines.total}}</span>
                </div>
              </div>
            </div>
          </el-col>
        </el-row>
        <el-row>
          <el-divider />
        </el-row>

        <el-table :data="tableData.files" :default-sort="{ prop: 'file', order: 'ascending' }" :row-class-name="tableRowClassName" border
          style="width: 100%">
          <el-table-column sortable prop="path" label="File" width="600">
            <template #default="scope"> <el-link type="primary"
                :href="scope.row.link">{{scope.row.path}}</el-link></template>
          </el-table-column>
          <el-table-column sortable prop="summary.functions.pct" label="Functions"></el-table-column>
          <el-table-column prop="summary.functions.total,summary.functions.covered" label="">
            <template #default="scope">{{scope.row.summary.functions.covered}}/{{scope.row.summary.functions.total}}</template>
          </el-table-column>
          <el-table-column sortable prop="summary.branches.pct" label="Branches"></el-table-column>
          <el-table-column prop="summary.branches.total,summary.branches.covered" label="">
            <template #default="scope">{{scope.row.summary.branches.covered}}/{{scope.row.summary.branches.total}}</template>
          </el-table-column>
          <el-table-column sortable prop="summary.lines.pct" label="Lines"></el-table-column>
          <el-table-column prop="summary.lines.total,summary.lines.covered" label="">
            <template #default="scope">{{scope.row.summary.lines.covered}}/{{scope.row.summary.lines.total}}</template>
          </el-table-column>
        </el-table>
      </el-main>
      <el-footer align="middle" class="footer">
        Code coverage generated by <el-link href="https://github.com/SMAT-Lab/bjc" type="primary" target="_blank">bjc</el-link> at {{tableData.date}}
      </el-footer>
    </el-container>
  </div>
</body>

<script>
  const App = {
    data() {
      return {
        tableData: {"date":"Thu Aug 06 2026 17:19:48 GMT+0800 (中国标准时间)","files":[{"version":"bjc v1.0.0","versionCode":10000,"path":"WindowLayoutPolicy.ets","hash":"fb6125b2cea08f0189e4ce17734dbaa74c3ce85e619dd24693d331aadcf9bef9","lineCnt":18,"count":0,"projectPath":"C:/Users/mu/Desktop/code/demo/harmony/app","functions":[{"name":"layoutModeForWidthBreakpoint","count":5,"regions":[{"startLoc":{"line":6,"col":1},"endLoc":{"line":17,"col":2},"count":5,"ignored":0},{"startLoc":{"line":9,"col":5},"endLoc":{"line":10,"col":33},"count":2,"ignored":0},{"startLoc":{"line":14,"col":5},"endLoc":{"line":15,"col":32},"count":3,"ignored":0},{"startLoc":{"line":8,"col":5},"endLoc":{"line":8,"col":35},"count":1,"ignored":0},{"startLoc":{"line":11,"col":5},"endLoc":{"line":11,"col":35},"count":1,"ignored":0},{"startLoc":{"line":12,"col":5},"endLoc":{"line":12,"col":35},"count":2,"ignored":0},{"startLoc":{"line":13,"col":5},"endLoc":{"line":13,"col":35},"count":3,"ignored":0}],"branches":[{"startLoc":{"line":8,"col":10},"endLoc":{"line":8,"col":34},"trueCount":1,"falseCount":11,"group":[0,1,2,3,4,5],"ignored":0},{"startLoc":{"line":9,"col":10},"endLoc":{"line":9,"col":34},"trueCount":2,"falseCount":10,"group":[0,1,2,3,4,5],"ignored":0},{"startLoc":{"line":11,"col":10},"endLoc":{"line":11,"col":34},"trueCount":1,"falseCount":11,"group":[0,1,2,3,4,5],"ignored":0},{"startLoc":{"line":12,"col":10},"endLoc":{"line":12,"col":34},"trueCount":2,"falseCount":10,"group":[0,1,2,3,4,5],"ignored":0},{"startLoc":{"line":13,"col":10},"endLoc":{"line":13,"col":34},"trueCount":3,"falseCount":9,"group":[0,1,2,3,4,5],"ignored":0},{"startLoc":{"line":14,"col":5},"endLoc":{"line":14,"col":5},"trueCount":3,"falseCount":9,"group":[0,1,2,3,4,5],"ignored":0}],"ignored":0,"index":0}],"exeLine":{"0":1,"1":2,"2":3,"3":6,"4":7,"5":8,"6":9,"7":10,"8":11,"9":12,"10":13,"11":14,"12":15},"summary":{"lines":{"total":10,"covered":10,"pct":100,"executedLineCount":[-1,-1,-1,-1,-1,-1,5,5,12,12,2,12,12,12,12,3,-1,-1,-1]},"functions":{"total":1,"covered":1,"pct":100},"branches":{"total":6,"covered":6,"pct":100}},"link":"WindowLayoutPolicy.ets.html"}],"summary":{"lines":{"total":10,"covered":10,"pct":100},"functions":{"total":1,"covered":1,"pct":100},"branches":{"total":6,"covered":6,"pct":100}}},
        tableRowClassName: ({row, rowIndex}) => {
          if (row.summary.lines.pct > 70) {
            return 'high-row'
          } else if (row.summary.lines.pct > 33) {
            return 'medium-row'
          }
          return 'low-row'
        }
      };
    }
  };

  const app = Vue.createApp(App);
  app.use(ElementPlus);
  app.mount("#app");
</script>

<style scoped>
  .el-statistic {
    --el-statistic-content-font-size: 28px;
  }

  .statistic-card {
    height: 100%;
    padding: 20px;
    border-radius: 4px;
    background-color: var(--el-bg-color-overlay);
  }

  .statistic-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    font-size: 12px;
    color: var(--el-text-color-regular);
    margin-top: 16px;
  }

  .statistic-footer .footer-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .statistic-footer .footer-item span:last-child {
    display: inline-flex;
    align-items: center;
    margin-left: 4px;
  }

  .el-container {
    min-height: 100vh;
    height: 100%;
  }

  .footer {
    font-size: small;
  }

  .el-table .low-row {
    --el-table-tr-bg-color: var(--el-color-error-light-9);
  }

  .el-table .medium-row {
    --el-table-tr-bg-color: var(--el-color-warning-light-9);
  }
  .el-table .high-row {
    --el-table-tr-bg-color: var(--el-color-success-light-9);
  }
</style>

</html>
